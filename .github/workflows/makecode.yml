name: Compilar .hex de la micro:bit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compilar con MakeCode
        run: npx --yes makecode build
      - name: Copiar .hex con nombre claro
        run: |
          ls -la built || true
          cp built/binary.hex compostaje-microbit.hex
      - name: Compilar diagnostico DS18B20
        working-directory: diagnostico_ds18b20
        run: npx --yes makecode build && cp built/binary.hex ../diagnostico-ds18b20.hex
      - name: Compilar version provisional (temperatura interna)
        working-directory: provisional_temp_interna
        run: npx --yes makecode build && cp built/binary.hex ../PROVISIONAL-temp-interna.hex
      - uses: actions/upload-artifact@v4
        with:
          name: compostaje-microbit-hex
          path: |
            compostaje-microbit.hex
            diagnostico-ds18b20.hex
            PROVISIONAL-temp-interna.hex
